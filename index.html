<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS Company - Stock & Inventory Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Include Libraries for Excel Reading, Barcodes, and PDF Generation -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px); }
        .bg-gradient-custom { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 font-sans min-h-screen text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="min-h-screen bg-slate-900 flex items-center justify-center p-4 bg-gradient-custom">
        <div class="max-w-4xl w-full bg-white dark:bg-slate-900 rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2 border border-slate-700">
            
            <!-- STAFF LOGIN -->
            <div class="p-8 bg-slate-50 dark:bg-slate-900/50 flex flex-col justify-center border-b md:border-b-0 md:border-r border-slate-200 dark:border-slate-800">
                <div class="flex items-center space-x-3 mb-6">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-indigo-800 text-white font-black text-xl flex items-center justify-center shadow-lg tracking-wider border border-indigo-400">
                        SS
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white">SS Company</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Staff Operations Portal</p>
                    </div>
                </div>

                <form onsubmit="handleStaffLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Select Staff Member</label>
                        <select id="staffUserSelect" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-semibold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800">
                            <!-- Loaded dynamically -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Password</label>
                        <input type="password" id="staffPassInput" placeholder="Enter password" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100">
                    </div>

                    <div id="staffError" class="text-xs text-rose-600 font-bold hidden">Invalid Password!</div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-sm shadow-md transition">
                        Login as Staff <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </form>
            </div>

            <!-- ADMIN LOGIN -->
            <div class="p-8 bg-white dark:bg-slate-900 flex flex-col justify-center">
                <div class="flex items-center space-x-3 mb-6">
                    <div class="w-12 h-12 rounded-2xl bg-slate-900 dark:bg-indigo-600 text-white font-black text-xl flex items-center justify-center shadow-lg tracking-wider border border-slate-700">
                        SS
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Admin Portal</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">SS Company Control Panel</p>
                    </div>
                </div>

                <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Admin Username</label>
                        <input type="text" id="adminUserInput" value="admin" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-slate-900 outline-none text-sm font-semibold text-slate-800 dark:text-slate-100 bg-white dark:bg-slate-800">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Admin Password</label>
                        <input type="password" id="adminPassInput" placeholder="Enter Admin Password" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-slate-900 outline-none text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100">
                    </div>

                    <div id="adminError" class="text-xs text-rose-600 font-bold hidden">Invalid Admin Credentials!</div>

                    <button type="submit" class="w-full bg-slate-900 hover:bg-black dark:bg-indigo-600 dark:hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-sm shadow-md transition">
                        Login as Admin <i class="fa-solid fa-lock ml-2"></i>
                    </button>
                </form>
            </div>

        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboardScreen" class="hidden min-h-screen flex flex-col">
        <!-- Top Header -->
        <header class="glass-panel border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30 px-6 py-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-800 text-white font-black text-lg flex items-center justify-center shadow-md tracking-wider border border-indigo-400">
                    SS
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">SS Company</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium" id="currentUserDisplay">Stock & Inventory System</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="roleBadge" class="px-3 py-1 rounded-xl text-xs font-bold bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300">Staff Mode</span>
                
                <!-- Dark / Light Mode Toggle Button -->
                <button onclick="toggleTheme()" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-amber-400 px-3.5 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 transition shadow-sm" title="Toggle Theme">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                    <span id="themeBtnText">Dark</span>
                </button>

                <!-- Settings Button -->
                <button onclick="switchView('settings')" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-3.5 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 transition shadow-sm">
                    <i class="fa-solid fa-gear text-indigo-600 dark:text-indigo-400"></i>
                    <span>Settings</span>
                </button>

                <!-- Logout Button -->
                <button onclick="logout()" class="bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/50 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-400 px-3.5 py-2 rounded-xl text-xs font-bold flex items-center space-x-1 transition shadow-sm">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>
        </header>

        <!-- Layout Body -->
        <div class="flex flex-1 max-w-7xl w-full mx-auto p-6 gap-6">
            
            <!-- Left Sidebar Navigation -->
            <aside class="w-64 flex-shrink-0 space-y-4">
                <div class="glass-panel p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-2">
                    <button onclick="switchView('inventory')" id="navInvBtn" class="w-full text-left bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 font-bold px-4 py-3 rounded-xl text-xs flex items-center space-x-3 transition">
                        <i class="fa-solid fa-chart-pie text-sm"></i>
                        <span>Dashboard & Stock</span>
                    </button>
                    
                    <button onclick="switchView('waybill')" id="navWaybillBtn" class="w-full text-left hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold px-4 py-3 rounded-xl text-xs flex items-center space-x-3 transition border border-slate-100 dark:border-slate-800">
                        <i class="fa-solid fa-file-invoice text-indigo-600 dark:text-indigo-400 text-sm"></i>
                        <span>Waybill Generator</span>
                    </button>

                    <button onclick="switchView('settings')" id="navSetBtn" class="w-full text-left hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold px-4 py-3 rounded-xl text-xs flex items-center space-x-3 transition border border-slate-100 dark:border-slate-800">
                        <i class="fa-solid fa-user-gear text-indigo-600 dark:text-indigo-400 text-sm"></i>
                        <span>Settings & Profile</span>
                    </button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-1 space-y-6">
                
                <!-- VIEW 1: INVENTORY DASHBOARD -->
                <div id="sectionInventory" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="glass-panel p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold uppercase text-slate-400">Total Products</p>
                                <h3 class="text-2xl font-bold mt-1 text-slate-900 dark:text-white" id="totalItemsCount">0</h3>
                            </div>
                            <div class="p-3 bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 rounded-xl">
                                <i class="fa-solid fa-box text-xl"></i>
                            </div>
                        </div>

                        <div class="glass-panel p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold uppercase text-slate-400">Low Stock Alert</p>
                                <h3 class="text-2xl font-bold mt-1 text-amber-600 dark:text-amber-400" id="lowStockCount">0 Items</h3>
